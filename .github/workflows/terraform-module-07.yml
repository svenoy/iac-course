name: terraform-module-07

on:
  pull_request:
    branches: [main]
    paths:
      - 'module-07/**'
      - '.github/workflows/terraform-module-07.yml'
    # Workflow will run on pull requests to main branch, IF the changes are in the module-07 
    # folder or in the workflow file itself.
    # It tells GitHub to only run this pipeline if files inside this folder are changed. (If we 
    # edit a file outside this folder, the pipeline ignores it.) If we edit the workflow file 
    # itself, e.g. to add new jobs, and don't include workflow file in the trigger list, GitHub
    # will not run the pipeline (to test new changes).
  push:
    branches: [main]
    paths:
      - 'module-07/**'
      - '.github/workflows/terraform-module-07.yml'
    # See comments above. (This is the same filter, but for pushes (to main branch). Both triggers 
    # are necessay; we want to test changes in PRs AND when we push directly to main branch.)

permissions:
  id-token: write               # OIDC trust with Azure (from module 6)
  contents: read
  pull-requests: write          # Allows GitHub to post comments in the PR later

defaults:
  run:
    working-directory: module-07     # Location of the Terraform root.
# Tells GitHub server/runner to cd into module-07 folder before running Terraform commands. 
# Thus, everything will work like on the local machine.

env:
  ARM_USE_OIDC:        "true"
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  plan:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      
      - uses: Azure/login@v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          
      - uses: hashicorp/setup-terraform@v3
      
      - run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=module-07/dev/network.tfstate"
            
      - run: terraform plan -var-file="dev.tfvars" -no-color

  apply-dev:
    needs: build
    if: github.event_name == 'push'
    # This job will only run on pushes to main branch (not on PRs). It will apply the changes to the dev environment.
    # When we click the "Merge" button on GitHub, that merge action is registered as a push 
    # to main branch. This will stop the plan job (a preview no longer needed) and lets the 
    # apply-dev job run to build the infrastructure.
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      
      - uses: Azure/login@v3.1.0
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          
      - uses: hashicorp/setup-terraform@v3
      
      - run: |
          terraform init \
            -backend-config=backend.hcl \
            -backend-config="key=module-07/dev/network.tfstate"
            
      - run: terraform apply -auto-approve -var-file="dev.tfvars"